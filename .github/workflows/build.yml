# Builds the installers on GitHub's machines: Windows (NSIS .exe) and macOS
# (.dmg for Apple Silicon and Intel, ad-hoc signed: no Apple developer account).
# Runs on a tag like v0.1.0, or by hand from the Actions tab. The installers are
# attached to the run (Artifacts); a tag also makes a draft GitHub Release.

name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
            files: |
              release/*.exe
          - os: macos-latest
            args: --mac
            files: |
              release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Build installers
        run: npx vite build && npx electron-builder ${{ matrix.args }} --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: krypt-marketo-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ matrix.files }}
